<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collectify - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Collectify</h1>
        <p>Account Access</p>
        <a class="nav-link" href="index.html">Back to Auctions</a>
    </header>

    <main class="auth-layout">
        <section class="auth-panel auth-tabs-panel">
            <div class="demo-account">
                <strong>Admin demo:</strong>
                <span>admin@collectify.local / Admin12345</span>
            </div>

            <div class="auth-tabs" role="tablist" aria-label="Account forms">
                <button class="auth-tab active" type="button" onclick="switchAuthTab('login')" id="loginTab">
                    Login
                </button>
                <button class="auth-tab" type="button" onclick="switchAuthTab('register')" id="registerTab">
                    Register
                </button>
            </div>

            <form id="loginForm" class="auth-form active" onsubmit="loginAccount(event)">
                <h2>Login</h2>
                <input type="email" id="loginEmail" placeholder="Email address" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button class="text-button" type="button" onclick="showAuthMessage('Password reset email feature will be added with backend email support.')">
                    Forgot password?
                </button>
                <button type="submit" id="loginButton">
                    Login
                </button>
                <p class="auth-switch">
                    Do not have an account?
                    <button class="text-button" type="button" onclick="switchAuthTab('register')">Register here</button>
                </p>
            </form>

            <form id="registerForm" class="auth-form" onsubmit="registerAccount(event)">
                <h2>Create Account</h2>
                <input type="text" id="registerName" placeholder="Full name" required>
                <input type="email" id="registerEmail" placeholder="Email address" required>
                <input type="password" id="registerPassword" placeholder="Password" required>
                <button type="submit" id="registerButton">
                    Register
                </button>
                <p class="auth-switch">
                    Already have an account?
                    <button class="text-button" type="button" onclick="switchAuthTab('login')">Login here</button>
                </p>
            </form>
        </section>
    </main>

    <section class="admin auth-message">
        <h2>Status</h2>
        <p id="authMessage">Use these forms to prepare login and registration for the backend connection.</p>
    </section>

    <script>
        const API_BASE = "http://127.0.0.1:5000/api";

        function switchAuthTab(tabName) {
            const isLogin = tabName === "login";
            document.getElementById("loginForm").classList.toggle("active", isLogin);
            document.getElementById("registerForm").classList.toggle("active", !isLogin);
            document.getElementById("loginTab").classList.toggle("active", isLogin);
            document.getElementById("registerTab").classList.toggle("active", !isLogin);
        }

        function showAuthMessage(message, type = "info") {
            const authMessage = document.getElementById("authMessage");
            authMessage.textContent = message;
            authMessage.className = `auth-status ${type}`;
        }

        function setAuthLoading(buttonId, isLoading) {
            const button = document.getElementById(buttonId);
            button.disabled = isLoading;
            button.textContent = isLoading ? "Please wait..." : button.dataset.label;
        }

        async function authRequest(path, payload) {
            const response = await fetch(`${API_BASE}${path}`, {
                method: "POST",
                credentials: "include",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });
            const data = await response.json().catch(() => ({}));

            if (!response.ok) {
                const error = new Error(data.error || "Account request failed.");
                error.code = data.code || "AUTH_ERROR";
                throw error;
            }

            return data;
        }

        function rememberUser(user) {
            localStorage.setItem("collectifyUserName", user.name);
            localStorage.setItem("collectifyUserEmail", user.email);
            localStorage.setItem("collectifyUserRole", user.role || (user.email === "admin@collectify.local" ? "admin" : "customer"));
        }

        function returnToAuctions() {
            window.setTimeout(() => {
                window.location.href = "index.html";
            }, 900);
        }

        function isValidEmail(email) {
            return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email);
        }

        function validateAuthInput({ name = "User", email, password, requireName = false }) {
            if (requireName && name.trim().length < 2) {
                return "Name must be at least 2 characters.";
            }

            if (!isValidEmail(email)) {
                return "Enter a valid email address.";
            }

            if (password.length < 8) {
                return "Password must be at least 8 characters.";
            }

            return "";
        }

        function saveOfflineUser({ name, email }) {
            rememberUser({ name, email });
            showAuthMessage("Backend is offline, so demo login was saved locally. Returning to auctions...", "warning");
            returnToAuctions();
        }

        function showRegisterPrompt(email) {
            showAuthMessage("This email is not registered. Switch to Register and create an account first.", "warning");
            document.getElementById("registerEmail").value = email;
            window.setTimeout(() => {
                switchAuthTab("register");
                document.getElementById("registerName").focus();
            }, 900);
        }

        async function loginAccount(event) {
            event.preventDefault();
            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value;

            const validationMessage = validateAuthInput({ email, password });

            if (validationMessage) {
                showAuthMessage(validationMessage, "error");
                return;
            }

            showAuthMessage("Checking your account...", "info");
            setAuthLoading("loginButton", true);

            try {
                const user = await authRequest("/auth/login", { email, password });
                rememberUser(user);
                showAuthMessage(`Welcome back, ${user.name}. Returning to auctions...`, "success");
                returnToAuctions();
            } catch (error) {
                if (error.message === "Failed to fetch") {
                    const name = email === "admin@collectify.local" ? "Collectify Admin" : email.split("@")[0];
                    saveOfflineUser({ name, email });
                } else if (error.code === "USER_NOT_FOUND") {
                    showRegisterPrompt(email);
                } else {
                    showAuthMessage(error.message, "error");
                }
            } finally {
                setAuthLoading("loginButton", false);
            }
        }

        async function registerAccount(event) {
            event.preventDefault();
            const name = document.getElementById("registerName").value.trim();
            const email = document.getElementById("registerEmail").value.trim();
            const password = document.getElementById("registerPassword").value;

            const validationMessage = validateAuthInput({ name, email, password, requireName: true });

            if (validationMessage) {
                showAuthMessage(validationMessage, "error");
                return;
            }

            showAuthMessage("Creating your account...", "info");
            setAuthLoading("registerButton", true);

            try {
                const user = await authRequest("/auth/register", { name, email, password });
                rememberUser(user);
                showAuthMessage(`Account created for ${user.name}. Returning to auctions...`, "success");
                switchAuthTab("login");
                returnToAuctions();
            } catch (error) {
                if (error.message === "Failed to fetch") {
                    saveOfflineUser({ name, email });
                } else {
                    showAuthMessage(error.message, "error");
                }
            } finally {
                setAuthLoading("registerButton", false);
            }
        }

        document.getElementById("loginButton").dataset.label = "Login";
        document.getElementById("registerButton").dataset.label = "Register";
    </script>

</body>
</html>
