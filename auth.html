<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collectify - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Collectify</h1>
        <p>Account Access</p>
        <a class="nav-link" href="index.html">Back to Auctions</a>
    </header>

    <main class="auth-layout">
        <section class="auth-panel">
            <h2>Login</h2>
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email address" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="button" onclick="showAuthMessage('Login will connect to the backend API next.')">
                    Login
                </button>
            </form>
        </section>

        <section class="auth-panel">
            <h2>Create Account</h2>
            <form id="registerForm">
                <input type="text" id="registerName" placeholder="Full name" required>
                <input type="email" id="registerEmail" placeholder="Email address" required>
                <input type="password" id="registerPassword" placeholder="Password" required>
                <button type="button" onclick="showAuthMessage('Registration will connect to the backend API next.')">
                    Register
                </button>
            </form>
        </section>
    </main>

    <section class="admin auth-message">
        <h2>Status</h2>
        <p id="authMessage">Use these forms to prepare login and registration for the backend connection.</p>
    </section>

    <script>
        function showAuthMessage(message) {
            document.getElementById("authMessage").textContent = message;
        }
    </script>

</body>
</html>
